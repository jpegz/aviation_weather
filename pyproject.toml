[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aviation_weather"
version = "0.3.0"
description = "Utility for getting aviation weather information"
readme = "README.md"
authors = [
    { name = "José Peguero", email = "jose@pegosaur.us" },
    { name = "Arnaldo Pereira", email = "aepereira@gmail.com" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.4",
]

[project.scripts]
aviation_weather = "aviation_weather.__main__:main"

[project.urls]
Homepage = "http://github.com/jpegz/jpegz_aviation_weather"
Repository = "http://github.com/jpegz/jpegz_aviation_weather.git"

[tool.hatch.build.targets.wheel]
packages = ["aviation_weather"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=aviation_weather --cov-report=term-missing"
